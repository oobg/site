name: deploy-production

run-name: 'production 후보 배포 ${{ inputs.sha }} by @${{ github.actor }}'

on:
  workflow_dispatch:
    inputs:
      sha:
        description: main에 포함된 정확한 40자리 commit SHA
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: OCI production
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - name: 배포 연결 설정 확인
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for key in DEPLOY_HOST DEPLOY_HOST_KEY TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET DEPLOY_SSH_KEY; do
            [ -n "${!key:-}" ] || missing+=("$key")
          done
          [ "${#missing[@]}" -eq 0 ] || { printf '::error::missing production setting: %s\n' "${missing[@]}"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: main에 포함된 SHA인지 확인
        id: target
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::40자리 lowercase commit SHA가 필요합니다.'; exit 1; }
          git show-ref --verify --quiet refs/remotes/origin/main \
            || { echo '::error::checkout에 origin/main ref가 없습니다.'; exit 1; }
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main \
            || { echo '::error::입력 SHA는 origin/main의 조상이 아닙니다.'; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: 검증한 SHA 체크아웃
        run: git checkout --detach '${{ steps.target.outputs.sha }}'

      - name: Tailscale 합류
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: OCI 주소 확인
        id: host
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if getent hosts "$DEPLOY_HOST" >/dev/null 2>&1; then
            addr="$DEPLOY_HOST"
          else
            addr="$(tailscale status --json | jq -r --arg h "${DEPLOY_HOST%%.*}" '.Peer[] | select((.HostName | ascii_downcase) == ($h | ascii_downcase)) | .TailscaleIPs[0]' | head -n 1)"
          fi
          [ -n "${addr:-}" ] && [ "$addr" != null ] || { echo '::error::production 호스트를 tailnet에서 찾지 못했습니다.'; exit 1; }
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: SSH 신뢰 설정
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          ADDR: ${{ steps.host.outputs.addr }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/raven-production
          chmod 600 ~/.ssh/raven-production
          : > ~/.ssh/raven-production-known-hosts
          printf '%s\n' "$DEPLOY_HOST_KEY" | while IFS= read -r line; do
            [ -n "$line" ] || continue
            key="$(printf '%s' "$line" | awk '{for(i=1;i<=NF;i++) if ($i ~ /^(ssh-|ecdsa-|sk-)/) {o=$i; for(j=i+1;j<=NF;j++) o=o" "$j; print o; exit}}')"
            [ -n "$key" ] || continue
            printf '%s %s\n' "$DEPLOY_HOST" "$key" >> ~/.ssh/raven-production-known-hosts
            printf '%s %s\n' "$ADDR" "$key" >> ~/.ssh/raven-production-known-hosts
          done
          test -s ~/.ssh/raven-production-known-hosts || { echo '::error::DEPLOY_HOST_KEY를 파싱하지 못했습니다.'; exit 1; }
          chmod 600 ~/.ssh/raven-production-known-hosts

      - name: production Access docs 설정 반영
        env:
          ADDR: ${{ steps.host.outputs.addr }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE: ${{ vars.CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}" ] || { echo '::error::missing production variable: CLOUDFLARE_ACCESS_TEAM_DOMAIN'; exit 1; }
          [ -n "${CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE:-}" ] || { echo '::error::missing production variable: CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE'; exit 1; }
          ssh -i ~/.ssh/raven-production -o UserKnownHostsFile=~/.ssh/raven-production-known-hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "ubuntu@$ADDR" \
            "python3 - \"$CLOUDFLARE_ACCESS_TEAM_DOMAIN\" \"$CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE\"" <<'PY'
          from pathlib import Path
          import os
          import sys
          import tempfile

          path = Path.home() / "raven-production" / "config" / ".env.production"
          team_domain, docs_audience = sys.argv[1:3]
          updates = {
              "CLOUDFLARE_ACCESS_TEAM_DOMAIN": team_domain,
              "CLOUDFLARE_API_DOCS_ACCESS_AUDIENCE": docs_audience,
          }
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          seen = set()
          for line in lines:
              key, separator, _ = line.partition("=")
              if separator and key in updates:
                  output.append(f"{key}={updates[key]}")
                  seen.add(key)
              else:
                  output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f"{key}={value}")
          content = "\n".join(output) + "\n"
          fd, temporary = tempfile.mkstemp(prefix=".env.production.", dir=str(path.parent), text=True)
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as handle:
                  handle.write(content)
              os.chmod(temporary, 0o600)
              os.replace(temporary, path)
          finally:
              try:
                  os.unlink(temporary)
              except FileNotFoundError:
                  pass
          PY

      - name: production 호스트 표식 확인
        env:
          ADDR: ${{ steps.host.outputs.addr }}
        run: |
          ssh -i ~/.ssh/raven-production -o UserKnownHostsFile=~/.ssh/raven-production-known-hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
            "ubuntu@$ADDR" 'test "$(tr -d "\r\n" < "$HOME/raven-production/config/DEPLOY_TARGET")" = raven-production'

      - name: 검증한 소스 동기화
        env:
          ADDR: ${{ steps.host.outputs.addr }}
        run: |
          rsync -az --delete --mkpath \
            --exclude='.git/' --exclude='.env*' --exclude='node_modules/' --exclude='.next/' \
            -e "ssh -i $HOME/.ssh/raven-production -o UserKnownHostsFile=$HOME/.ssh/raven-production-known-hosts -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            ./ "ubuntu@$ADDR:raven-production/app/"

      - name: OCI에서 빌드 및 기동
        env:
          ADDR: ${{ steps.host.outputs.addr }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          ssh -i ~/.ssh/raven-production -o UserKnownHostsFile=~/.ssh/raven-production-known-hosts \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "ubuntu@$ADDR" "bash raven-production/app/deploy/server/deploy-production.sh '$SHA'"
