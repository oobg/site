user nginx;
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  proxy_cache_path /dev/shm/weserv-cache
    levels=1:2
    keys_zone=raven_images:32m
    max_size=768m
    inactive=7d
    use_temp_path=off;

  server {
    listen 127.0.0.1:8080;
    server_name localhost;

    location ^~ /assets/ {
      limit_except GET HEAD {
        deny all;
      }

      weserv filter;
      weserv_error_redirect off;
      weserv_max_size 25m;
      weserv_process_timeout 10s;
      weserv_limit_input_pixels 40000000;
      weserv_limit_output_pixels 25000000;

      alias /srv/assets/;
      disable_symlinks on;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 80 default_server;
    server_name _;

    location = /health {
      access_log off;
      default_type application/json;
      add_header Cache-Control "no-store" always;
      return 200 '{"status":"ready"}';
    }

    location ^~ /assets/ {
      limit_except GET HEAD {
        deny all;
      }

      if ($arg_url != "") {
        return 400;
      }
      if ($arg_default != "") {
        return 400;
      }

      proxy_cache raven_images;
      proxy_cache_key "$request_method|$request_uri";
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Content-Type-Options nosniff always;

      proxy_pass http://127.0.0.1:8080;
      proxy_set_header Host localhost;
      proxy_set_header X-Forwarded-For "";
    }

    location / {
      return 404;
    }
  }
}
